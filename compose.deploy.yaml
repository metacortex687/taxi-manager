services:
  db:
    restart: unless-stopped
    labels:
      logging: "alloy"
    # Журналирование ошибок PostgreSQL в лог контейнера
    command:
      - postgres
      - -c
      - log_destination=stderr
      - -c
      - logging_collector=off
      - -c
      - log_min_messages=warning
      - -c
      - log_min_error_statement=error
    volumes:
      - deploy-db:/var/lib/postgresql/data

  taxi-app:
    restart: unless-stopped

  task-worker:
    image: taxi-manager-ci:${BUILD_NUMBER:-local}
    restart: unless-stopped
    labels:
      logging: "alloy"
    environment:
      DATABASE_URL: postgis://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-taxi_manager}
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      LOCATIONIQ_KEY: ${LOCATIONIQ_KEY}
      PYTHONUNBUFFERED: "1"

      OTEL_SERVICE_NAME: taxi-manager-task-worker
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      DJANGO_SETTINGS_MODULE: taxi_manager.infrastructure.settings_wsgi
      OTEL_PYTHON_LOG_CORRELATION: "true"
      OTEL_PYTHON_LOG_LEVEL: info
      OTEL_PYTHON_LOG_FORMAT: >-
        %(asctime)s %(levelname)s [%(name)s]
        [trace_id=%(otelTraceID)s span_id=%(otelSpanID)s
        service_name=%(otelServiceName)s] %(message)s

      PYROSCOPE_ENABLED: "false"
      PYROSCOPE_APPLICATION_NAME: taxi-manager-task-worker
      PYROSCOPE_SERVER_ADDRESS: http://alloy:9999
      PYROSCOPE_SAMPLE_RATE: "100"
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-dev}
    command:
      - uv
      - run
      - opentelemetry-instrument
      - python
      - manage.py
      - db_worker
      - --queue-name
      - reports,geocoding,default
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - observability

  swagger-ui:
    image: swaggerapi/swagger-ui
    restart: unless-stopped
    environment:
      URLS: >-
        [
          {
            "name": "Rust API",
            "url": "/swagger/rust-open-api-schema.yml"
          },
          {
            "name": "Django API",
            "url": "/api/v1/schema/"
          }
        ]
      URLS_PRIMARY_NAME: "Django API"
    volumes:
      - ./rust-api/rust-open-api-schema.yml:/usr/share/nginx/html/rust-open-api-schema.yml:ro
    depends_on:
      taxi-app:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    labels:
      logging: "alloy"
    environment:
      DEPLOY_COMMIT_HASH: "${DEPLOY_COMMIT_HASH}"
      DEPLOY_COMMIT_TIME: "${DEPLOY_COMMIT_TIME}"
      DEPLOY_TIME: "${DEPLOY_TIME}"
      NGINX_ENVSUBST_FILTER: "^DEPLOY_"
    depends_on:
      taxi-app:
        condition: service_healthy
      swagger-ui:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.deploy.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  deploy-db: