services:
  db:
    restart: unless-stopped
    volumes:
      - deploy-db:/var/lib/postgresql/data

  taxi-app:
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      DEPLOY_COMMIT_HASH: "${DEPLOY_COMMIT_HASH}"
      DEPLOY_COMMIT_TIME: "${DEPLOY_COMMIT_TIME}"
      DEPLOY_TIME: "${DEPLOY_TIME}"
      NGINX_ENVSUBST_FILTER: "^DEPLOY_"
    depends_on:
      taxi-app:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.deploy.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  deploy-db: