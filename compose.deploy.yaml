services:
  db:
    restart: unless-stopped
    volumes:
      - deploy-db:/var/lib/postgresql/data

  taxi-app:
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      taxi-app:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.deploy.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  deploy-db: